name: ci

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - tests/**
      - examples/**
      - atlas/**
      - .github/workflows/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest with coverage (floor 90%)
        run: python -m pytest -v --cov=reasoning_dataset_lab --cov-report=term-missing --cov-fail-under=90

      - name: Validate example map
        run: rdlab map check examples/t10-pilot-a.map.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check
