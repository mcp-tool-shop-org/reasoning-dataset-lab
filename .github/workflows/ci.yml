name: ci

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - tests/**
      - examples/**
      - atlas/**
      - .github/workflows/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python 3.15. The main leg: the Atlas check runs here once.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest with coverage (floor 90%)
        run: uv run pytest -v --cov=reasoning_dataset_lab --cov-report=term-missing --cov-fail-under=90

      - name: Validate example map
        run: uv run rdlab map check examples/t10-pilot-a.map.yaml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

  # Python 3.13. A job of its own so the check named "test" keeps its name (it runs on 3.15).
  test-py313:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest with coverage (floor 90%)
        run: uv run pytest -v --cov=reasoning_dataset_lab --cov-report=term-missing --cov-fail-under=90

      - name: Validate example map
        run: uv run rdlab map check examples/t10-pilot-a.map.yaml

  # Python 3.14. A job of its own so the check named "test" keeps its name (it runs on 3.15).
  test-py314:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest with coverage (floor 90%)
        run: uv run pytest -v --cov=reasoning_dataset_lab --cov-report=term-missing --cov-fail-under=90

      - name: Validate example map
        run: uv run rdlab map check examples/t10-pilot-a.map.yaml
