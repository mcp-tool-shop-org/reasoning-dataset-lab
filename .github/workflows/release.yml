# Publishes reasoning-dataset-lab to PyPI when a GitHub release is published.
# Jobs: build, publish, upload. The publish step attaches PyPI's own attestations (PEP 740). The SLSA generator is not
# used here: it must be referenced by tag, and this repository pins every action by commit sha (a test enforces it).
# Trusted publishing: PyPI trusts this repository, this file name, and the
# pypi environment. No API token is stored.
# It runs only when a GitHub release is published: there is no manual trigger, so nothing
# else can reach the publish job. It is not push-triggered.
# Undo: delete the release asset. A PyPI file is yanked.
# Owner: the Publisher.

name: Release

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"

      - name: The tag matches the version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          ref_type = os.environ["GITHUB_REF_TYPE"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          if ref_type != "tag":
              raise SystemExit(
                  f"ref {ref_name!r} is a {ref_type}, not a tag. "
                  "Dispatch this workflow on the release tag."
              )
          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          tag = ref_name[1:] if ref_name.startswith("v") else ref_name
          if tag != version:
              raise SystemExit(
                  f"tag {ref_name} does not match pyproject version {version}"
              )
          PY

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  upload:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Attach the wheel and the sdist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" dist/*.whl dist/*.tar.gz
