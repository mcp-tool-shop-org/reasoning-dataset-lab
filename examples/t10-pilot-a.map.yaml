map_version: 1
dataset: verifier-t10-pilot-a
axes:
  trait: [T10]
  kind: [B]
  difficulty: [d2, d3, d4]
  domain: [lamps, cups]
  wrong_family:
    - exact_read_as_floor
    - exact_read_as_ceiling
    - floor_read_as_exact
    - ceiling_read_as_exact
cells:
  # Buildable claim cells: exact_read_as_floor (6 cells x 5 items = 30 items)
  - {trait: T10, kind: B, difficulty: d2, domain: lamps, wrong_family: exact_read_as_floor, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d2, domain: cups, wrong_family: exact_read_as_floor, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d3, domain: lamps, wrong_family: exact_read_as_floor, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d3, domain: cups, wrong_family: exact_read_as_floor, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d4, domain: lamps, wrong_family: exact_read_as_floor, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d4, domain: cups, wrong_family: exact_read_as_floor, target: 5, capacity: 5}
  # Buildable claim cells: exact_read_as_ceiling (6 cells x 5 items = 30 items)
  - {trait: T10, kind: B, difficulty: d2, domain: lamps, wrong_family: exact_read_as_ceiling, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d2, domain: cups, wrong_family: exact_read_as_ceiling, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d3, domain: lamps, wrong_family: exact_read_as_ceiling, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d3, domain: cups, wrong_family: exact_read_as_ceiling, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d4, domain: lamps, wrong_family: exact_read_as_ceiling, target: 5, capacity: 5}
  - {trait: T10, kind: B, difficulty: d4, domain: cups, wrong_family: exact_read_as_ceiling, target: 5, capacity: 5}
  # Planned floor claim cells (capacity: 0, reason: "role-set PR pending")
  - {trait: T10, kind: B, difficulty: d2, domain: lamps, wrong_family: floor_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d2, domain: cups, wrong_family: floor_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d3, domain: lamps, wrong_family: floor_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d3, domain: cups, wrong_family: floor_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d4, domain: lamps, wrong_family: floor_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d4, domain: cups, wrong_family: floor_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  # Planned ceiling claim cells (capacity: 0, reason: "role-set PR pending")
  - {trait: T10, kind: B, difficulty: d2, domain: lamps, wrong_family: ceiling_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d2, domain: cups, wrong_family: ceiling_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d3, domain: lamps, wrong_family: ceiling_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d3, domain: cups, wrong_family: ceiling_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d4, domain: lamps, wrong_family: ceiling_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
  - {trait: T10, kind: B, difficulty: d4, domain: cups, wrong_family: ceiling_read_as_exact, target: 0, capacity: 0, reason: "role-set PR pending"}
splits:
  train: 48
  eval: 12
shares:
  - {axis: wrong_family, min_distinct: 2, max_share: 0.50}
  - {axis: domain, min_distinct: 2, min_share: 0.50, max_share: 0.50}
variety:
  skeleton_distinct_share: 1.0
  max_phrase_share: 0.40
  max_formula_share: 0.25
acceptance:
  key_proof_rate: {kind: B, min: 1.0}
  min_pass_rate_per_class: 0.50
  critic_agreement: {report_only: true}
  human_sample: {size: 20, max_defects: 1}
