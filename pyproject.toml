[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reasoning-dataset-lab"
version = "0.4.0"
description = "Map-first dataset lab for proven reasoning puzzles, verification items, and composed dataset parts."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mcp-tool-shop" }]
keywords = ["dataset", "reasoning", "puzzles", "synthetic-data", "provenance", "training-data", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml==6.0.3",
    "aspire-si-gates==1.7.6",
    "role-set==0.3.0",
]

[project.urls]
Homepage = "https://mcp-tool-shop-org.github.io/reasoning-dataset-lab/"
Repository = "https://github.com/mcp-tool-shop-org/reasoning-dataset-lab"
Changelog = "https://github.com/mcp-tool-shop-org/reasoning-dataset-lab/blob/main/CHANGELOG.md"
Issues = "https://github.com/mcp-tool-shop-org/reasoning-dataset-lab/issues"

[project.optional-dependencies]
dev = [
    "coverage==7.16.2",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]

[project.scripts]
rdlab = "reasoning_dataset_lab.cli:main"

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_dataset_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--cov=reasoning_dataset_lab --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["reasoning_dataset_lab"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
