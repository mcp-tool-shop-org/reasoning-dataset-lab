summary: "reasoning-dataset-lab plans a dataset as a pre-registered map, builds items whose answer keys are constructed and proved by code, asks a local model only for the wording, and records the provenance of every item."
boundaries:
  - name: .github
    globs:
      - .github/**
    role: config
  - name: certification
    globs:
      - certification/**
    role: data
  - name: examples
    globs:
      - examples/**
    role: data
  - name: scripts
    globs:
      - scripts/**
    role: code
  - name: site
    globs:
      - site/**
    role: docs
  - name: docs
    globs:
      - docs/**
    role: docs
  - name: src
    globs:
      - src/**
    role: code
  - name: tests
    globs:
      - tests/**
    role: test
  - name: root
    globs:
      - "*"
    role: config
